<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Pehchaan">
  <!--
    The product's own gesture, at 16px: a line of text, and the bar that takes
    one of them away. Ink ground rather than paper, because a near-white tile
    disappears into a light tab strip; the accent bar is what the eye catches at
    favicon size, so the redaction is the thing that reads, not the document.
    Three shapes, no text: type at this size is mush, and a glyph would need a
    font we would have to embed.
  -->
  <rect width="32" height="32" rx="7" fill="#17181b" />
  <rect x="7" y="8" width="14" height="3.5" rx="1.75" fill="#f5f5f2" opacity="0.55" />
  <!-- One line of text and one bar, not two and one: at 16px a second grey line
       closes up against the first and the pair reads as a hamburger menu. The
       bar runs wider than the line it covers, because a redaction that stops
       short of the edge of its field is not a redaction. -->
  <rect x="6" y="17.5" width="20" height="6.5" rx="2" fill="#f97316" />
</svg>
